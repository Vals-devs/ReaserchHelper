limit_req_zone $binary_remote_addr zone=login_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _ research.ivalpermana.my.id localhost;

    # Max upload size (for PDF uploads)
    client_max_body_size 50M;

    # HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Auth rate limited location
    location /api/auth/ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://backend:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests -> FastAPI backend
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Frontend static files (served by frontend container's nginx)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
